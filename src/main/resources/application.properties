spring.application.name=ai-chatbot-api
server.port=${SERVER_PORT:8080}

# This API has its own JWT-based auth (AuthController/SecurityConfig); without this exclusion
# Spring Security's UserDetailsServiceAutoConfiguration would still generate and log a random
# default login password at startup, which is noise we never use.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Load local secrets from a git-ignored .env file in the working directory, if present.
# Real environment variables still take precedence over values in .env.
spring.config.import=optional:file:.env[.properties]

# --- Store identity (used in the system prompt) ---
app.store-name=${STORE_NAME:Aronno Mart}
app.timezone=${APP_TIMEZONE:Asia/Dhaka}

# --- Admin login (POST /api/auth/login) ---
# No endpoint issues a token without these credentials, and there is no default:
# a blank ADMIN_USERNAME/ADMIN_PASSWORD simply means login always fails.
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

# --- JWT configuration ---
# No default on purpose: JwtService refuses to build (and the app refuses to start)
# if JWT_SECRET is missing or shorter than 32 bytes.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- CORS (for a separately hosted UI) ---
# Comma-separated exact origins, e.g. https://chat.example.com,https://admin.example.com
# Empty disables CORS entirely. Wildcards are rejected at startup.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Provider selection ---
app.default-provider=${DEFAULT_PROVIDER:claude}
# Optional: id of a provider to retry with if the chosen provider fails (claude|gemini|openai).
app.fallback-provider=${AI_FALLBACK_PROVIDER:}

# --- Anthropic / Claude ---
# CLAUDE_API_KEY must be supplied as an environment variable to use provider "claude".
claude.api-key=${CLAUDE_API_KEY:}
# Check https://docs.anthropic.com/en/docs/about-claude/models for a current model name.
claude.model=${CLAUDE_MODEL:claude-haiku-5-5}
claude.max-tokens=${CLAUDE_MAX_TOKENS:2048}

# --- Google Gemini ---
# GEMINI_API_KEY must be supplied as an environment variable to use provider "gemini".
gemini.api-key=${GEMINI_API_KEY:}
# Check https://ai.google.dev/gemini-api/docs/models for a current model name.
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.max-tokens=${GEMINI_MAX_TOKENS:2048}

# --- OpenAI ---
# OPENAI_API_KEY must be supplied as an environment variable to use provider "openai".
# Check https://platform.openai.com/docs/models for a current model name before relying on
# the default. Reasoning models spend part of max-tokens on hidden reasoning; raise it if
# answers come back empty.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.4-mini-2026-03-17}
openai.max-tokens=${OPENAI_MAX_TOKENS:4096}

# --- Chat behaviour / guardrails ---
chat.history-messages=${CHAT_HISTORY_MESSAGES:10}
chat.history-char-budget=${CHAT_HISTORY_CHAR_BUDGET:6000}
chat.max-message-chars=${CHAT_MAX_MESSAGE_CHARS:2000}
chat.max-messages-per-conversation=${CHAT_MAX_MESSAGES_PER_CONVERSATION:100}
chat.rate-limit-per-minute=${CHAT_RATE_LIMIT_PER_MINUTE:20}
chat.max-ai-calls-per-day=${CHAT_MAX_AI_CALLS_PER_DAY:200}

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/chatbot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secret}

# --- Flyway ---
# The Postgres-only location (full-text indexes) is appended here; the "test" profile
# (see application-test.properties) overrides this to the portable location only.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgres

# --- Actuator (health check only) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Logging ---
logging.level.com.example.aichatbot=INFO
