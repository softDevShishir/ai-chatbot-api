# Activated via @ActiveProfiles("test") on Spring-context test classes.
# Runs entirely against an in-memory H2 database: no Postgres, no network, no API keys.

spring.datasource.url=jdbc:h2:mem:chatbot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Postgres-only full-text migrations (tsvector/GIN) are not H2-compatible; skip that location.
spring.flyway.locations=classpath:db/migration

# Deterministic test credentials/secret so tests never depend on the developer's shell env.
jwt.secret=unit-test-jwt-secret-key-at-least-32-bytes-long
admin.username=test-admin
admin.password=test-admin-password
